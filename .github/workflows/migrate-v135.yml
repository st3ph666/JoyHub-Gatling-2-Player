name: Migrate JoyHub Gatling 2 Player v1.3.5

on:
  push:
    paths:
      - '.github/workflows/migrate-v135.yml'
      - 'tools/migrate_v135.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tkinter for validation
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Migrate source
        run: python3 tools/migrate_v135.py
      - name: Compile modules
        run: python3 -m compileall -q src/joyhub_gatling2 JoyHub-Gatling-2-Player-v1.3.5.py
      - name: Verify imports
        run: PYTHONPATH=src python3 -c 'import joyhub_gatling2.main'
      - name: Remove compile caches and migration helpers
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -f tools/migrate_v135.py .github/workflows/migrate-v135.yml
      - name: Commit migrated v1.3.5
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refactor v1.3.5 into modules with uv deployment'
          git push
